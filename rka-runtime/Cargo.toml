[workspace]
members = [
    "crates/rka-ksu-manager",
    "crates/rka-protocol",
    "crates/rka-rkp",
    "crates/rka-sidecar",
    "crates/rka-state",
    "crates/rka-transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
repository = "https://github.com/Enginex0/TEESimulator-RS"

[workspace.dependencies]
ciborium = "=0.2.2"
libc = "=0.2.189"
rcgen = { version = "=0.14.8", default-features = false, features = ["ring", "zeroize"] }
pem = "=3.0.6"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
socket2 = "=0.6.5"
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "net", "process", "std"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "=0.103.13", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "2.0.17"
x509-parser = { version = "=0.18.1", features = ["verify"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
use_debug = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
mod_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enums = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"
