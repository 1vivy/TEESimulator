# Identifier-free exact compatibility profile. Values not queryable by stable AIDL
# are checked from binder/service topology and reported as STOP when ambiguous.
PROFILE=api36-arm64-qcom-default-v1
SDK=36
ABI=arm64-v8a
KERNELSU_VERSION=3.2.5
SELINUX=enforcing
AVB_STATE=green
KEYMINT_DEFAULT_VERSION=4
KEYMINT_DEFAULT_RPC=3
STRONGBOX_VERSION=3
KEYSTORE_CONTEXT=u:r:keystore:s0
DEFAULT_INSTANCE=android.hardware.security.keymint.IKeyMintDevice/default
PASSTHROUGH_INSTANCES=android.hardware.security.keymint.IKeyMintDevice/strongbox,android.hardware.security.keymint.IRemotelyProvisionedComponent/default,android.hardware.security.keymint.IRemotelyProvisionedComponent/strongbox,android.hardware.security.keymint.IRemotelyProvisionedComponent/avf
MAX_OPERATIONS=1
DEADLINE_SECONDS=120
